<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>SmartShop Agent</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
        }

        button {
            padding: 10px 20px;
            margin-top: 10px;
            cursor: pointer;
        }

        #result {
            margin-top: 30px;
            padding: 20px;
            background: #f4f4f4;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

<h1>SmartShop Agent</h1>

<p>
    Ask the AI shopping assistant about products,
    inventory or your cart.
</p>

<textarea id="message">

</textarea>

<br>

<button onclick="sendMessage()">
    Ask Agent
</button>

<div id="result"></div>

<script>

async function sendMessage() {

    const message =
        document.getElementById("message").value;

    const result =
        document.getElementById("result");

    result.innerText = "Agent is thinking...";

    const response = await fetch("/chat", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            message: message
        })
    });

    const data = await response.json();

    result.innerText = data.answer;
}

</script>

</body>

</html>
